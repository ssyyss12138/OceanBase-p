[project]
name = "causal-corner-store"
version = "1.0.0"
description = "A Dify game where remembered choices have consequences"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi==0.121.1", "uvicorn==0.38.0", "httpx==0.28.1", "pydantic==2.12.4", "python-dotenv==1.2.1", "pyyaml==6.0.3", "filelock==3.20.0"]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "quickjs==1.19.4",
    "ruff==0.14.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
