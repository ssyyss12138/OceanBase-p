name: causal-corner-store
x-api-env: &api-env
  DEPLOY_ENV: PRODUCTION
  EDITION: SELF_HOSTED
  SECRET_KEY: ${DIFY_SECRET_KEY:?run scripts/init_config.py}
  DB_USERNAME: dify
  DB_PASSWORD: ${DB_PASSWORD:?run scripts/init_config.py}
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: dify
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?run scripts/init_config.py}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  STORAGE_TYPE: opendal
  OPENDAL_SCHEME: fs
  OPENDAL_FS_ROOT: storage
  VECTOR_STORE: weaviate
  MIGRATION_ENABLED: 'true'
  CODE_EXECUTION_ENDPOINT: http://sandbox:8194
  CODE_EXECUTION_API_KEY: ${SANDBOX_API_KEY:?run scripts/init_config.py}
  SSRF_PROXY_HTTP_URL: ''
  SSRF_PROXY_HTTPS_URL: ''
  HTTP_REQUEST_MAX_CONNECT_TIMEOUT: 30
  HTTP_REQUEST_MAX_READ_TIMEOUT: 120
  HTTP_REQUEST_MAX_WRITE_TIMEOUT: 60
  HTTP_REQUEST_MAX_RETRIES: 0
  LOG_LEVEL: WARNING
  ENABLE_REQUEST_LOGGING: 'false'
  CHECK_UPDATE_URL: ''
  MARKETPLACE_ENABLED: 'false'
  SERVER_WORKER_AMOUNT: 1
  SERVER_WORKER_CONNECTIONS: 20
  GUNICORN_TIMEOUT: 360
  APP_MAX_EXECUTION_TIME: 360
services:
  db:
    image: postgres:15.14-alpine
    environment:
      POSTGRES_USER: dify
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: dify
    volumes: [dify-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U dify -d dify']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4.6-alpine
    command: [redis-server, --requirepass, '${REDIS_PASSWORD}']
    volumes: [dify-redis:/data]
    restart: unless-stopped
  sandbox:
    image: langgenius/dify-sandbox:0.2.12
    environment:
      API_KEY: ${SANDBOX_API_KEY}
      GIN_MODE: release
      ENABLE_NETWORK: 'false'
      WORKER_TIMEOUT: 15
    restart: unless-stopped
  api:
    image: langgenius/dify-api:1.9.2
    environment:
      <<: *api-env
      MODE: api
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      sandbox: {condition: service_started}
    volumes: [dify-storage:/app/api/storage]
    ports: ['127.0.0.1:5001:5001']
    restart: unless-stopped
  worker:
    image: langgenius/dify-api:1.9.2
    environment:
      <<: *api-env
      MODE: worker
      CELERY_WORKER_AMOUNT: 1
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    volumes: [dify-storage:/app/api/storage]
    restart: unless-stopped
  web:
    image: langgenius/dify-web:1.9.2
    environment:
      NEXT_TELEMETRY_DISABLED: '1'
      PM2_INSTANCES: 1
      TEXT_GENERATION_TIMEOUT_MS: 180000
    restart: unless-stopped
  nginx:
    image: nginx:1.28.0-alpine
    ports: ['127.0.0.1:8080:80']
    volumes: ['./nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [api, web]
    restart: unless-stopped
  powercontext:
    build:
      context: ..
      dockerfile: deploy/PowerContext.Dockerfile
    environment:
      POWERCONTEXT_SERVER_DATABASE: '{"kind":"sqlite","url":"sqlite+aiosqlite:////data/powercontext.sqlite"}'
      POWERCONTEXT_SERVER_AUTH_ENABLED: 'true'
      POWERCONTEXT_SERVER_AUTH_TOKEN: ${POWERCONTEXT_TOKEN}
      POWERCONTEXT_SERVER_ACCESS_MODE: disabled
      POWERCONTEXT_SERVER_LOGGING_DIRECTORY: /data/logs
    volumes: [powercontext-data:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 60
  game:
    build:
      context: ..
      dockerfile: deploy/Game.Dockerfile
    environment:
      GAME_API_KEY: ${GAME_API_KEY}
      PLAYER_HASH_SECRET: ${PLAYER_HASH_SECRET}
      GAME_DB: /data/game.sqlite
      POWERCONTEXT_URL: http://powercontext:8000
      POWERCONTEXT_TOKEN: ${POWERCONTEXT_TOKEN}
    volumes: [game-data:/data]
    depends_on:
      powercontext: {condition: service_healthy}
    ports: ['127.0.0.1:8090:8090']
    restart: unless-stopped
volumes:
  dify-db:
  dify-redis:
  dify-storage:
  powercontext-data:
  game-data:
